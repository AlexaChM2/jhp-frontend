<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Motocicletas - Acceso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            width: 450px;
            max-width: 100%;
            background-color: #ffffff;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 10px 15px -3px, rgba(0, 0, 0, 0.1) 0px 4px 6px -2px;
            border-radius: 30px;
            padding: 35px;
            box-sizing: border-box;
        }

        .title {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 900;
            font-size: 1.5em;
            margin-top: 10px;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 20px;
        }

        .form {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .input {
            background-color: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            margin-bottom: 12px;
            padding: 12px 15px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input:focus {
            border-color: #ff3d00;
            background-color: #fff;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group .input {
            flex: 1;
            margin-bottom: 0;
        }

        .page-link {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 15px;
        }

        .page-link-label {
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #ff3d00;
        }

        .page-link-label:hover {
            text-decoration: underline;
        }

        .form-btn {
            padding: 12px;
            background: linear-gradient(135deg, #ff3d00 0%, #ff6b35 100%);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .form-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 61, 0, 0.3);
        }

        .sign-up-label {
            text-align: center;
            font-size: 13px;
            color: #727272;
            margin-top: 20px;
        }

        .sign-up-link {
            margin-left: 5px;
            cursor: pointer;
            font-weight: 700;
            color: #ff3d00;
        }

        .sign-up-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #ffcdd2;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #c8e6c9;
        }

        .hidden {
            display: none !important;
        }

        /* Scroll para el registro */
        #view-register {
            max-height: 550px;
            overflow-y: auto;
            padding-right: 8px;
        }

        #view-register::-webkit-scrollbar {
            width: 6px;
        }

        #view-register::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }

        #view-register::-webkit-scrollbar-thumb {
            background: #ff3d00;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <p class="title" id="formTitle">Sistema de Motocicletas</p>
        <p class="subtitle">Tu tienda de confianza</p>
        
        <div id="error-box" class="error-message"></div>
        <div id="success-box" class="success-message"></div>

        <!-- VISTA: INICIO DE SESIÓN -->
        <div id="view-login">
            <form class="form" id="loginForm">
                <input type="email" id="correo" class="input" placeholder="Correo electrónico" required autocomplete="email">
                <input type="password" id="password" class="input" placeholder=" Contraseña" required autocomplete="current-password">
                
                <p class="page-link">
                    <span class="page-link-label" id="btnForgot">¿Olvidaste tu contraseña?</span>
                </p>
                
                <button type="submit" class="form-btn">Iniciar Sesión</button>
            </form>
            
            <p class="sign-up-label">
                ¿No tienes cuenta? <span class="sign-up-link" id="linkToRegister">Regístrate aquí</span>
            </p>
        </div>

        <!-- VISTA: REGISTRO DE CLIENTES -->
        <div id="view-register" class="hidden">
            <form class="form" id="registerForm">
                <div class="input-group">
                    <input type="text" id="regNombre" class="input" placeholder="Nombre *" required>
                    <input type="text" id="regApaterno" class="input" placeholder="A. Paterno *" required>
                </div>
                <input type="text" id="regAmaterno" class="input" placeholder="Apellido Materno">
                <input type="email" id="regCorreo" class="input" placeholder="Correo electrónico *" required>
                <input type="tel" id="regTelefono" class="input" placeholder="Teléfono (10 dígitos)" maxlength="10">
                <input type="text" id="regDireccion" class="input" placeholder=" Dirección">
                <input type="password" id="regPassword" class="input" placeholder="Contraseña * (Mayúscula + minúscula + número)" required>
                <input type="password" id="regPassword_confirmation" class="input" placeholder="Confirmar contraseña *" required>
                
                <button type="submit" class="form-btn">Crear Cuenta</button>
            </form>
            
            <p class="sign-up-label">
                ¿Ya tienes cuenta? <span class="sign-up-link" id="linkToLoginFromReg">Inicia Sesión aquí</span>
            </p>
        </div>

        <!-- VISTA: RECUPERACIÓN DE CONTRASEÑA -->
        <div id="view-recovery" class="hidden">
            <form class="form" id="recoveryForm">
                <p style="font-size: 13px; color: #555; margin-bottom: 15px; text-align: center;">
                    Introduce tu correo y te enviaremos los detalles para restablecer tu contraseña.
                </p>
                <input type="email" id="recoverCorreo" class="input" placeholder="Tu correo electrónico" required>
                
                <button type="submit" class="form-btn">Enviar Instrucciones</button>
            </form>
            
            <p class="sign-up-label">
                Volver al <span class="sign-up-link" id="linkToLoginFromRec">Iniciar Sesión</span>
            </p>
        </div>

    </div>

    <script src="login.js"></script>
</body>
</html>
