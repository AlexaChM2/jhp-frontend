
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container-fluid mt-4">
    <h2 class="mb-4">
        <i class="fas fa-tools me-2"></i>
        Órdenes de Servicio
    </h2>

    <!-- BUSCADOR -->
    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <input type="text" class="form-control form-control-lg" id="inputBuscarServicio" placeholder="Buscar por folio o cliente...">
                <button class="btn btn-dark" type="button">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <button class="btn btn-dark btn-lg w-100" onclick="window.abrirModalServicio()">
                <i class="fas fa-plus-circle"></i> Nueva Orden
            </button>
        </div>
    </div>

    <!-- ESTADISTICAS -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-danger shadow-sm">
                <div class="card-body">
                    <h5>Servicios Pendientes</h5>
                    <h3 id="totalServiciosPendientes">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success shadow-sm">
                <div class="card-body">
                    <h5>Servicios Terminados</h5>
                    <h3 id="totalServiciosTerminados">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info shadow-sm">
                <div class="card-body">
                    <h5>Ingresos</h5>
                    <h3 id="ingresosServicios">$0.00</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- TABLA DE HISTORIAL -->
    <div class="card shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Folio</th>
                            <th>Cita</th>
                            <th>Cliente</th>
                            <th>Modelo Moto</th>
                            <th>Mecánico</th>
                            <th>Mano Obra</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaServicios">
                        <tr>
                            <td colspan="9" class="text-center py-4">
                                <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                                <span class="ms-2">Cargando registros...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="modalMantenimiento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">
                    <i class="fas fa-file-invoice me-2"></i>Nueva Orden de Servicio
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="formMantenimiento" onsubmit="return false;">
                    <input type="hidden" id="id_cita_input" name="id_cita">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Cliente *</label>
                            <select id="id_cliente" name="id_cliente" class="form-select" required>
                                <option value="">Seleccione cliente...</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Mecánico Asignado *</label>
                            <select id="id_mecanico" name="id_mecanico" class="form-select" required>
                                <option value="">Seleccione mecánico...</option>
                            </select>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">Modelo de Motocicleta *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-motorcycle"></i></span>
                                <input type="text" id="moto_modelo" name="moto_modelo" class="form-control" placeholder="Ej. Yamaha R6 2023" required>
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">Descripción de Llegada / Motivo</label>
                            <textarea id="moto_llegada_descripcion" name="moto_llegada_descripcion" class="form-control" rows="3" placeholder="Detalles reportados por el cliente..."></textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Mano de Obra ($)</label>
                            <input type="number" id="mano_obra" name="mano_obra" class="form-control" value="0" min="0" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Estado</label>
                            <select id="estado_servicio" name="estado_servicio" class="form-select">
                                <option value="Pendiente">Pendiente</option>
                                <option value="En Proceso">En Proceso</option>
                                <option value="Completado">Completado</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </div>
                    </div>
                    
                    <hr>
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="button" class="btn btn-success px-4" onclick="window.guardarServicio()">
                            <i class="fas fa-save me-2"></i>Guardar Orden
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<script src="js/servicios.js"></script>
