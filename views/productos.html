<div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalProductoTitle">
                    <i class="fas fa-box me-2"></i> Registrar Nuevo Producto
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <!-- Código y Nombre -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-barcode"></i> Código</span>
                            <input type="text" id="producto_codigo" class="form-control" 
                                   placeholder="Ingrese código único" maxlength="50">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-tag"></i> Nombre*</span>
                            <input type="text" id="producto_nombre" class="form-control" 
                                   placeholder="Ingrese nombre del producto">
                        </div>
                    </div>
                </div>

                <!-- Tipo y Marca -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Tipo</label>
                        <input type="text" id="producto_tipo" class="form-control" 
                               placeholder="Ej: Refacción, Accesorio">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Marca</label>
                        <select id="producto_marca_select" class="form-select">
                            <option value="">Seleccionar marca...</option>
                        </select>
                    </div>
                </div>

                <!-- Precio y Stock -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-dollar-sign"></i> Precio Venta*</span>
                            <input type="number" id="producto_precio" class="form-control" 
                                   placeholder="0.00" step="0.01" min="0">
                            <span class="input-group-text">MXN</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-cubes"></i> Stock</span>
                            <input type="number" id="producto_stock" class="form-control" 
                                   placeholder="0" min="0" value="0">
                        </div>
                    </div>
                </div>

                <!-- Categoría y Proveedor -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-folder"></i> Categoría</span>
                            <select id="producto_categoria" class="form-select">
                                <option value="">Seleccionar categoría...</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-truck"></i> Proveedor</span>
                            <select id="producto_proveedor" class="form-select">
                                <option value="">Seleccionar proveedor...</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fas fa-align-left"></i> Descripción</span>
                    <textarea class="form-control" id="producto_descripcion" 
                              placeholder="Descripción detallada del producto" rows="3"></textarea>
                </div>

                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> Los campos marcados con * son obligatorios.
                </div>

                <!-- BOTONES DEBAJO DEL FORMULARIO -->
                <div class="d-flex flex-column gap-2 mt-4 pt-3 border-top">
                    <button type="button" class="btn btn-success btn-lg" onclick="window.guardarProducto()">
                        <i class="fas fa-save me-2"></i> Guardar Producto
                    </button>
                    <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i> Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    
    <script src="../js/producto.js"></script>
</body>
</html>
