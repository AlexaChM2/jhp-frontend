<div class="container-fluid py-4">
    <h2 class="mb-4 fw-bold"><i class="fa-solid fa-calendar-check text-primary"></i> Gestión de Citas</h2>

    <!-- Clima y Pronóstico -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body d-flex align-items-center gap-3">
                    <img id="clima-icono" src="" alt="Clima" style="width:50px; display:none;">
                    <div>
                        <h6 class="mb-1"><i class="fas fa-cloud-sun text-warning"></i> Clima Actual</h6>
                        <span id="clima-actual-texto" class="text-muted">Cargando clima...</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0 bg-light">
                <div class="card-body">
                    <h6 class="mb-1"><i class="fas fa-calendar-alt text-info"></i> Pronóstico para citas</h6>
                    <span id="pronostico-texto" class="text-muted">Cargando...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de acción -->
    <div class="d-flex justify-content-between mb-4">
        <div class="input-group w-50 shadow-sm">
            <span class="input-group-text bg-white"><i class="fas fa-search"></i></span>
            <input type="text" class="form-control" id="inputBuscarCitaLocal" placeholder="Filtrar citas..." onkeyup="window.listarCitas()">
        </div>
        <button class="btn btn-warning fw-bold shadow-sm px-4" onclick="window.abrirModalCita()">
            Nueva Cita <i class="fas fa-plus-circle ms-1"></i>
        </button>
    </div>

    <!-- Tabla de Citas -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead style="background-color: #0c0c1d;" class="text-white">
                    <tr>
                        <th>FOLIO</th>
                        <th>FECHA / HORA</th>
                        <th>CLIENTE</th>
                        <th>TÉCNICO/EMPLEADO</th>
                        <th>MOTIVO</th>
                        <th>ESTADO</th>
                        <th class="text-center">ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="tablaCitas"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL DE CITA CON CALENDARIO INTEGRADO -->
<div id="modalCita" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1050; align-items:center; justify-content:center;">
    <div class="modal-content bg-white shadow-lg" style="width:95%; max-width:750px; border-radius:12px; overflow:visible;">
        <div class="modal-header p-3 bg-warning d-flex justify-content-between align-items-center">
            <h5 class="m-0 fw-bold" id="tituloModalCita">Programar Cita</h5>
            <button type="button" class="btn-close" onclick="window.cerrarModalCita()"></button>
        </div>
        <div class="modal-body p-4" style="max-height: 80vh; overflow-y: auto;">
            <form id="formCita">
                <input type="hidden" id="edit_id_cita" name="id_cita">
                
                <div class="row g-3">
                    <!-- Cliente -->
                    <div class="col-md-12 position-relative">
                        <label class="form-label fw-bold">Seleccionar Cliente</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" id="busCliCita" class="form-control" placeholder="Escribe nombre del cliente..." oninput="window.buscarClienteCita(this.value)" autocomplete="off">
                        </div>
                        <div id="resCliCita" class="list-group position-absolute w-100 shadow-lg" style="z-index:2000; display:none; max-height:200px; overflow-y:auto;"></div>
                    </div>

                    <!-- Empleado -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Empleado que registra</label>
                        <select id="id_empleado_select" class="form-select" onchange="window.seleccionarEmpleadoCita(this.value, this.options[this.selectedIndex].text)">
                            <option value="">Seleccione empleado...</option>
                        </select>
                    </div>

                    <!-- CALENDARIO DE SELECCIÓN DE FECHA -->
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Seleccionar Fecha</label>
                        <div id="calendarioSelector" class="border rounded p-2" style="background: #f8f9fa;"></div>
                        <div id="errorHorarioCita" class="text-danger small mt-1"></div>
                        <input type="hidden" id="cita_fecha" name="cita_fecha_programada">
                    </div>

                    <!-- HORARIOS DISPONIBLES -->
                    <div class="col-md-12" id="horariosContainer" style="display: none;">
                        <label class="form-label fw-bold">Horarios Disponibles</label>
                        <div id="listaHorariosDisponibles" class="d-flex flex-wrap gap-2 mb-2"></div>
                    </div>

                    <!-- Clima para la fecha -->
                    <div class="col-md-12">
                        <div id="clima-cita-info" class="alert alert-info py-2 mb-0" style="display:none;">
                            <i class="fas fa-cloud-sun me-1"></i>
                            <span id="clima-fecha-texto">Selecciona una fecha</span>
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Estado</label>
                        <select name="cita_estado" id="cita_estado" class="form-select">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Confirmada">Confirmada</option>
                            <option value="Realizada">Realizada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                    </div>

                    <!-- Tipo de Cita -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tipo de Cita</label>
                        <select name="cita_tipo" id="cita_tipo" class="form-select">
                            <option value="Servicio">Servicio (Correctivo)</option>
                            <option value="Preventivo">Mantenimiento Preventivo</option>
                            <option value="Venta">Venta</option>
                        </select>
                    </div>

                    <!-- Motivo -->
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Motivo de la Cita</label>
                        <textarea name="cita_motivo" id="cita_motivo" class="form-control" rows="2" placeholder="Describa el servicio solicitado..."></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer p-3 bg-light">
            <button class="btn btn-secondary" onclick="window.cerrarModalCita()">Cancelar</button>
            <button class="btn btn-success px-4 fw-bold" onclick="window.guardarCita()">GUARDAR CAMBIOS</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>
<script src="js/cita.js"></script>
