
<h2 class="mb-4"><i class="fa-solid fa-truck-ramp-box"></i> Compras / Entradas</h2>
<div class="input-group mb-4">
    <input type="text" class="form-control" id="inputBuscarCompra" 
           placeholder="Buscar por Factura o Proveedor..." onkeyup="buscarHistorialCompras()">
    <button class="btn btn-dark" onclick="abrirNuevaCompra()">
        Registrar Compra <i class="fa-solid fa-file-invoice-dollar ms-1"></i>
    </button>
</div>


<table class="main-table">
    <thead>
        <tr>
            <th>FOLIO</th>
            <th>Fecha</th>
            <th>Factura</th>
            <th>Total Compra</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tablaCompras"></tbody>
</table>


<div id="modalCompra" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <div class="modal-header text-center">
            <h3 class="m-0">Registro de Compra</h3>
            <small class="text-muted">Ingreso de mercancía al almacén</small>
        </div>

        <div class="modal-body-scroll">
           
            <div class="row g-2 mb-3">
                <div class="col-8">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-handshake"></i></span>
                        <input type="text" id="buscarProveedor" class="form-control" placeholder="Nombre del Proveedor..." oninput="seleccionarProveedor(this.value)">
                        <div id="listaResultadosProv" class="list-group position-absolute w-100" style="top:100%; z-index:10; display:none;"></div>
                    </div>
                </div>
                <div class="col-4">
                    <input type="text" id="factura_no" class="form-control" placeholder="No. Factura">
                </div>
            </div>

         
            <div class="product-selector p-3 border rounded bg-light mb-3">
                <div class="input-group mb-2">
                    <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                    <input type="text" id="buscarProductoCompra" class="form-control" placeholder="Buscar producto para comprar..." oninput="seleccionarProductoCompra(this.value)">
                    <div id="listaResultadosProdCompra" class="list-group position-absolute w-100" style="top:100%; z-index:10; display:none;"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
                    <div class="w-50">
                        <small class="text-muted">Cantidad:</small>
                        <input type="number" id="cant_compra" class="form-control" value="1" min="1" oninput="recalcularSubtotalCompra()">
                    </div>
                    <div class="w-50">
                        <small class="text-muted">Costo Unitario ($):</small>
                        <input type="number" id="costo_unitario" class="form-control" step="0.01" value="0.00" oninput="recalcularSubtotalCompra()">
                    </div>
                </div>
                <div class="text-end mb-2">
                    <span class="fw-bold text-success">Subtotal Item: $<span id="subtotal_item_compra">0.00</span></span>
                </div>
                <button class="btn btn-primary w-100 btn-sm" onclick="agregarArticuloCompra()">
                    <i class="fa-solid fa-plus"></i> Añadir a la lista
                </button>
            </div>

            
            <div class="table-container">
                <table class="table table-sm table-striped m-0" id="detalleTemporalCompra">
                    <thead class="table-dark">
                        <tr>
                            <th>Producto</th>
                            <th>Cant.</th>
                            <th>Costo</th>
                            <th>Sub</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="total-banner mt-3 bg-dark text-white p-2 text-center rounded">
                TOTAL COMPRA: $<span id="total_final_compra">0.00</span>
            </div>
        </div>

        <div class="modal-footer-btns mt-3 d-flex justify-content-end gap-2">
            <button class="btn btn-danger px-4" onclick="cerrarModalCompra()">Cancelar</button>
            <button class="btn btn-success px-4" onclick="finalizarCompra()">Confirmar Compra</button>
        </div>
    </div>
</div>

<script src="js/compra.js"></script>
