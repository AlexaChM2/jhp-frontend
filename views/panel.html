<div class="container-fluid mt-4">
    <h2 class="mb-4 fw-bold">Panel Administrativo</h2>

  <!-- Notificaciones con Bootstrap puro -->
<div class="dropdown">
    <button class="btn btn-link position-relative text-dark dropdown-toggle" type="button" id="btnNotificaciones" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="text-decoration: none;">
        <i class="fas fa-bell fs-5"></i>
        <span id="contadorNotificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
            0
        </span>
    </button>
    
    <div class="dropdown-menu dropdown-menu-end p-0 mt-2" id="dropdownNotificaciones" style="width: 350px; max-width: 90vw;">
        <div class="dropdown-header bg-white border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0">
                    <i class="fas fa-bell me-2 text-warning"></i>Notificaciones
                </h6>
                <button type="button" class="btn-close btn-sm" id="cerrarNotificacionesBs"></button>
            </div>
        </div>
        <div id="listaNotificaciones" class="dropdown-menu-end" style="max-height: 400px; overflow-y: auto;">
            <div class="text-center py-4 text-muted">
                <i class="fas fa-check-circle fa-2x mb-2"></i>
                <p class="mb-0">No hay notificaciones</p>
            </div>
        </div>
        <div class="dropdown-footer border-top p-2">
            <button id="btnVerTodoBs" class="btn btn-sm btn-outline-primary w-100">
                <i class="fas fa-eye me-1"></i>Ver todos los productos
            </button>
        </div>
    </div>
</div>

    <!-- CALENDARIO -->
    <div class="calendario-container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">
                <i class="fas fa-calendar-alt me-2 text-primary"></i>
                Calendario de Citas
            </h3>
            <button class="btn btn-success" onclick="window.cargarVista('views/cita.html')">
                <i class="fas fa-plus-circle"></i> Nueva Cita
            </button>
        </div>
        <div class="card shadow">
            <div class="card-body p-3">
                <div id="calendario" style="min-height: 550px; width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- REFACCIONARIAS CERCANAS -->
    <div class="card shadow mt-4">
        <div class="card-body">
            <h5><i class="fas fa-store text-primary me-2"></i>Refaccionarias Cercanas</h5>
            <div id="mapaRefaccionarias" style="height: 350px; width: 100%; border-radius: 8px; margin-bottom: 10px;"></div>
            <div id="listaRefaccionariasTexto" style="max-height: 150px; overflow-y: auto;"></div>
            <small class="text-muted mt-2 d-block">
                <i class="fas fa-map-pin me-1"></i>OpenStreetMap - Haz clic en los marcadores para ver informacion
            </small>
        </div>
    </div>

    <!-- MODAL CAJA -->
    <div id="modal-caja" class="modal-overlay" style="display:none;">
        <div class="modal-content-custom">
            <h3 class="fw-bold mb-2">Abrir Caja</h3>
            <p class="mb-4">Ingresa el monto inicial para iniciar la jornada:</p>
            <div class="mb-3 text-start">
                <label for="monto_inicial" class="form-label fw-semibold">Monto Inicial ($)</label>
                <input type="number" id="monto_inicial" class="form-control form-control-lg" placeholder="0.00" step="0.01">
            </div>
            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-light border flex-grow-1" onclick="window.cerrarModal()">Cancelar</button>
                <button class="btn btn-success flex-grow-1 fw-bold" onclick="window.confirmarAbrirCaja()">Confirmar Apertura</button>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>
<script src="js/panel.js?v=2"></script>
