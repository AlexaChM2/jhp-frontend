<div class="container-fluid mt-4">
    <h2 class="mb-4 fw-bold">Panel Administrativo</h2>

    <div class="dashboard-container">
        <div class="cards-grid">
            
            
            <div class="card card-ventas">
                <h3><i class="fas fa-cash-register"></i> Venta de Hoy</h3>
                <p class="monto" id="ventas-monto">$0.00</p>
                <small class="text-muted" id="ventas-actualizado">Actualizado hace un momento</small>
            </div>
            
            
            <div class="card card-caja">
                <h3><i class="fas fa-cash-register"></i> Estado de Caja</h3>
                <div id="estado-badge" class="badge rojo mb-3">Cerrada</div>
                
                <p id="monto-apertura-texto" style="display:none;" class="my-2">
                    Iniciada con: <span id="monto-inicial-val" class="fw-bold">$0</span>
                </p>
                
                <button id="btn-caja" class="btn btn-primary w-100 mt-2 py-2">
                    <i class="fas fa-door-open"></i> Abrir Caja
                </button>
            </div>

            
            <div class="card card-citas">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h3><i class="fas fa-calendar-check"></i> Citas</h3>
                    <select id="filtroCitasPanel" class="form-select form-select-sm w-auto" onchange="cargarCitasPanel()">
                        <option value="hoy" selected>Hoy</option>
                        <option value="semana">Esta Semana</option>
                        <option value="mes">Este Mes</option>
                    </select>
                </div>
                <p class="citas-numero" id="citas-hoy">0</p>
                <small class="text-muted">
                    <i class="fas fa-calendar-day"></i> 
                    <span id="filtro-citas-texto">Citas para hoy</span>
                </small>
                <div id="citas-lista" style="max-height: 200px; overflow-y: auto; margin-top: 10px;"></div>
                <button class="btn btn-outline-primary w-100 mt-3" onclick="window.cargarVista('views/cita.html')">
                    <i class="fas fa-calendar-week"></i> Ver Todas las Citas
                </button>
            </div>
        </div>
    </div>

    
<div class="calendario-container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">
            <i class="fas fa-calendar-alt me-2 text-primary"></i>
            Calendario de Citas
        </h3>
        <button class="btn btn-success" onclick="window.cargarVista('views/cita.html')">
            <i class="fas fa-plus-circle"></i> Nueva Cita
        </button>
    </div>

    <div class="card shadow">
        <div class="card-body p-3">
            
            <div id="calendario" style="min-height: 550px; width: 100%;"></div>
        </div>
    </div>
</div>

 
    <div id="modal-caja" class="modal-overlay" style="display:none;">
        <div class="modal-content-custom">
            <h3 class="fw-bold mb-2">Abrir Caja</h3>
            <p class="mb-4">Ingresa el monto inicial para iniciar la jornada:</p>
            
            <div class="mb-3 text-start">
                <label for="monto_inicial" class="form-label fw-semibold">Monto Inicial ($)</label>
                <input type="number" id="monto_inicial" class="form-control form-control-lg" placeholder="0.00" step="0.01">
            </div>

            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-light border flex-grow-1" onclick="window.cerrarModal()">Cancelar</button>
                <button class="btn btn-success flex-grow-1 fw-bold" onclick="window.confirmarAbrirCaja()">Confirmar Apertura</button>
            </div>
        </div>
    </div>
</div>


<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>


<script src="js/panel.js"></script>
