<!-- Notificaciones -->
<div class="position-relative d-inline-block me-3">
    <button type="button" id="btnNotificaciones" class="btn btn-link position-relative text-dark dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="text-decoration: none;">
        <i class="fas fa-bell fs-5"></i>
        <span id="contadorNotificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
            0
        </span>
    </button>
    
    <div class="dropdown-menu dropdown-menu-end p-0 mt-2" style="width: 350px; max-width: 90vw;">
        <div class="dropdown-header bg-white border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0">
                    <i class="fas fa-bell me-2 text-warning"></i>Notificaciones
                </h6>
                <button type="button" id="cerrarNotificacionesBs" class="btn-close btn-sm"></button>
            </div>
        </div>
        <div id="listaNotificaciones" style="max-height: 400px; overflow-y: auto;">
            <div class="text-center py-4 text-muted">
                <i class="fas fa-check-circle fa-2x mb-2"></i>
                <p class="mb-0">No hay notificaciones</p>
            </div>
        </div>
        <div class="dropdown-footer border-top p-2">
            <button id="btnVerTodoBs" class="btn btn-sm btn-outline-primary w-100">
                <i class="fas fa-eye me-1"></i>Ver todos los productos
            </button>
        </div>
    </div>
</div>
