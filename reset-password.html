<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Sistema de Motocicletas</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .reset-container {
            width: 450px;
            max-width: 100%;
            background-color: #ffffff;
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .title {
            text-align: center;
            font-weight: 900;
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }
        .input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .input:focus {
            border-color: #ff3d00;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff3d00 0%, #ff6b35 100%);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,61,0,0.3);
        }
        .info-box {
            background-color: #e3f2fd;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2 class="title">🔐 Restablecer Contraseña</h2>
        
        <div class="info-box">
            <i class="fas fa-info-circle"></i> Ingresa el token y tu nueva contraseña
        </div>
        
        <form id="resetForm">
            <input type="text" id="token" class="input" placeholder="Token de recuperación *" required>
            <input type="email" id="correo" class="input" placeholder="Correo electrónico *" required>
            <input type="password" id="password" class="input" placeholder="Nueva contraseña *" required>
            <input type="password" id="password_confirmation" class="input" placeholder="Confirmar contraseña *" required>
            
            <button type="submit" class="btn">Restablecer Contraseña</button>
        </form>
        
        <p class="text-center mt-3">
            <a href="index.html" style="color: #ff3d00; text-decoration: none;">← Volver al inicio de sesión</a>
        </p>
    </div>

    <script>
        const API_BASE = "https://jhpapi-production.up.railway.app/api";
        
        // Obtener token de la URL si existe
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            document.getElementById('token').value = tokenFromUrl;
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = document.getElementById('token').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirmation = document.getElementById('password_confirmation').value;
            
            if (!token || !correo || !password || !passwordConfirmation) {
                Swal.fire('Error', 'Todos los campos son obligatorios', 'error');
                return;
            }
            
            if (password !== passwordConfirmation) {
                Swal.fire('Error', 'Las contraseñas no coinciden', 'error');
                return;
            }
            
            if (password.length < 6) {
                Swal.fire('Error', 'La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/password-reset/reset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        email: correo,
                        password: password,
                        password_confirmation: passwordConfirmation
                    })
                });
                
                const result = await response.json();
                console.log('Respuesta reset:', result);
                
                if (response.ok && result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Contraseña actualizada!',
                        text: 'Ahora puedes iniciar sesión con tu nueva contraseña',
                        confirmButtonText: 'Ir al login'
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    Swal.fire('Error', result.message || 'Error al restablecer contraseña', 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'Error al conectar con el servidor', 'error');
            }
        });
    </script>
</body>
</html>
